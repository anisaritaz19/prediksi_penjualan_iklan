<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Prediksi Penjualan dari Iklan TV{% endblock %}</title>
  <meta name="description" content="Prediksi penjualan berdasarkan biaya iklan TV menggunakan Regresi Linear Sederhana.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-md navbar-glass sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <span class="brand-icon"><i class="bi bi-graph-up-arrow"></i></span>
      <span>AdSales<span class="text-accent">Predict</span></span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
            data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Menu">
      <i class="bi bi-list fs-2"></i>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-md-2">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == 'home' }}" href="{{ url_for('index') }}">
            <i class="bi bi-calculator me-1"></i>Prediksi
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if active == 'analisis' }}" href="{{ url_for('analisis') }}">
            <i class="bi bi-clipboard-data me-1"></i>Analisis Model
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>Tugas Akhir 2 (TA-2) &middot; Pembelajaran Mesin &middot; Regresi Linear Sederhana</span>
    <span class="text-muted-2">Flask &middot; Scikit-Learn &middot; Bootstrap</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
